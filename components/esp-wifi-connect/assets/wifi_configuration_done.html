<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#165dff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src 'self'">
    <title>配网成功</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #165dff;
            --text: #1d2129;
            --muted: #86909c;
            --background: #f2f3f5;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
            background: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            letter-spacing: 0;
            -webkit-font-smoothing: antialiased;
        }

        .panel {
            width: min(100%, 420px);
            padding: 36px 24px 32px;
            border: 1px solid rgba(22, 93, 255, .1);
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(29, 33, 41, .08);
            text-align: center;
        }

        .success-icon {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: var(--primary);
        }

        .success-icon::after {
            content: "";
            position: absolute;
            left: 22px;
            top: 18px;
            width: 24px;
            height: 13px;
            border-left: 4px solid #ffffff;
            border-bottom: 4px solid #ffffff;
            transform: rotate(-45deg);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.3;
            font-weight: 750;
        }

        p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 24px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 650;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            50% { opacity: .3; }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot { animation: none; }
        }
    </style>
</head>
<body>
    <main class="panel">
        <div class="success-icon" aria-hidden="true"></div>
        <h1>Wi-Fi 连接成功</h1>
        <p>设备已保存网络信息，正在退出配网模式并继续启动。现在可以关闭此页面。</p>
        <div class="status"><span class="dot" aria-hidden="true"></span><span>正在完成设备配置</span></div>
    </main>
    <script>
        window.setTimeout(function () {
            fetch('/exit', { method: 'POST', cache: 'no-store' }).catch(function () {});
        }, 1000);
    </script>
</body>
</html>
