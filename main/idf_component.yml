dependencies:
  # 名称虽包含 ML307，但同时提供项目使用的 Http/WebSocket/Mqtt/Udp 公共接口。
  78/esp-ml307: "3.6.5"
  # 公共音频、WakeNet 和状态图标依赖。板级 UI 与外设依赖由 boards/<board> 声明。
  espressif/esp_audio_effects: ~1.2.1
  espressif/esp_audio_codec: ~2.4.1
  78/xiaozhi-fonts: ~1.6.0
  espressif/esp-sr: ~2.3.0
  idf:
    # 项目已在 ESP-IDF 5.5.4 验证；6.x 暂不兼容当前 esp-sr 依赖。
    version: ">=5.5.2"
