dependencies:
  # 名称虽包含 ML307，但同时提供项目使用的 Http/WebSocket/Mqtt/Udp 公共接口。
  # 版本与官方 xiaozhi-esp32 对齐，已支持 ESP-IDF 6.x。
  78/esp-ml307: "~3.6.6"
  # 公共音频、WakeNet 和状态图标依赖。板级 UI 与外设依赖由 boards/<board> 声明。
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp_audio_codec: ~2.5.0
  # 保持 1.6.x：延续当前 Font Awesome 图标与普惠体/Puhui 字体体系，避免大改 UI 图标 API。
  78/xiaozhi-fonts: ~1.6.0
  espressif/esp-sr: ~2.4.7
  idf:
    # 主线已迁移到 ESP-IDF 6.0；依赖版本与官方对齐，支持 ESP-IDF 6.x 与 5.5.x。
    version: ">=5.5.2"
